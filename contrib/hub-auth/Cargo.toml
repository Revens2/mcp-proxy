[package]
name = "hub-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "OAuth 2.1 authorization server and RFC 7662 introspection for an mcp-proxy ChatGPT hub"
publish = false

# Standalone: not a member of the mcp-proxy package build.
[workspace]

[dependencies]
# Same OAuth authorization server as the existing VPS gateways.
mcp-auth = { git = "https://github.com/Revens2/mcp-framework-rs", rev = "aa22f66" }
mcp-http = { git = "https://github.com/Revens2/mcp-framework-rs", rev = "aa22f66" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.22"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
