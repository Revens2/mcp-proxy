# MCP hub staging -- include inside the mymcps.duckdns.org server block:
#   include snippets/hub-staging-mcp.conf;
#
# Public: OAuth (hub-auth 18983) and the exact /hub-staging/mcp route (mcp-proxy
# 18984). Never public: /introspect, /admin, /livez, /readyz, the GitHub
# staging facade (18985), and every other hub path.

# RFC 9728 protected resource metadata, served by mcp-proxy.
location = /.well-known/oauth-protected-resource/hub-staging/mcp {
    proxy_pass http://127.0.0.1:18984/.well-known/oauth-protected-resource/hub-staging/mcp;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

# RFC 8414 authorization server metadata (path-aware and legacy locations).
location = /.well-known/oauth-authorization-server/oauth/hub-staging {
    proxy_pass http://127.0.0.1:18983/.well-known/oauth-authorization-server;
    proxy_set_header Host       $host;
    proxy_buffering off;
}
location = /oauth/hub-staging/.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:18983/.well-known/oauth-authorization-server;
    proxy_set_header Host       $host;
    proxy_buffering off;
}

# Authorization endpoints. /introspect is deliberately absent.
location ~ ^/oauth/hub-staging/(authorize|token|register|revoke|consentement)$ {
    rewrite ^/oauth/hub-staging(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:18983;
    proxy_http_version 1.1;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering     off;
    proxy_cache         off;
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
}
# Everything else under the issuer is private (notably /introspect). Plain
# prefixes, not ^~, so the regex location above still wins for its endpoints.
location = /oauth/hub-staging/introspect { return 404; }
location /oauth/hub-staging/ { return 404; }

# MCP endpoint: exact path only, mapped to the hub root. Exact locations are
# matched first; every other /hub-staging/ path (admin, probes) is 404.
location = /hub-staging/mcp {
    rewrite ^ / break;
    proxy_pass http://127.0.0.1:18984;
    proxy_http_version 1.1;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering     off;
    proxy_cache         off;
    proxy_request_buffering off;
    client_max_body_size 256k;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    access_log /var/log/nginx/hub_staging_mcp_access.log;
    error_log  /var/log/nginx/hub_staging_mcp_error.log warn;
}
location /hub-staging/ { return 404; }
