transport = "http"
url = "http://127.0.0.1:18986/mcp"
bearer_token = "${MCP_HUB_TASKS_TOKEN}"
forward_auth = false
read_only_targets = [
    "tasks_list",
    "tasks_get",
    "tasks_search",
    "tasks_inbox",
    "tasks_today",
    "tasks_overdue",
    "tasks_upcoming",
    "tasks_unscheduled",
    "tasks_recently_changed",
    "tasks_history",
]
write_targets = [
    "tasks_create",
    "tasks_update",
    "tasks_complete",
    "tasks_reopen",
    "tasks_move",
    "tasks_delete",
]

[backends.timeout]
seconds = 30

[backends.concurrency]
max_concurrent = 4

# --- calendar: Google Calendar via a staging calendar-gateway-rs instance.
[[backends]]
name = "calendar"
transport = "http"
url = "http://127.0.0.1:18982/mcp"
bearer_token = "${MCP_HUB_CALENDAR_TOKEN}"
forward_auth = false
read_only_targets = [
    "list-calendars",
    "list-events",
    "search-events",
    "get-event",
    "list-colors",
    "get-freebusy",
    "get-current-time",
]
write_targets = [
    "create-event",
    "update-event",
    "delete-event",
]

[backends.timeout]
seconds = 30

[backends.concurrency]
max_concurrent = 4

# --- orch: Agent orchestrator via a staging orch-gateway-rs instance. *_wait tools block up to 60 s.
[[backends]]
name = "orch"
transport = "http"
url = "http://127.0.0.1:18977/mcp"
bearer_token = "${MCP_HUB_ORCH_TOKEN}"
forward_auth = false
read_only_targets = [
    "agent_runner_list",
    "agent_runner_inspect",
    "agent_workspace_list",
    "agent_job_list",
    "agent_job_get",
    "agent_job_output",
    "agent_job_events",
    "agent_job_wait",
    "agent_mission_get",
    "agent_mission_wait",
    "agent_question_list",
    "agent_question_get",
    "infra_alert_list",
    "infra_alert_get",
]
write_targets = [
    "agent_job_start",
    "agent_job_cancel",
    "agent_mission_create",
    "agent_mission_retry",
    "agent_mission_validate",
    "agent_question_answer",
]

[backends.timeout]
seconds = 75

[backends.concurrency]
max_concurrent = 4

# --- opus: Astra / Claude Opus via a staging claude-opus-mcp instance. opus_think can take minutes.
[[backends]]
name = "opus"
transport = "http"
url = "http://127.0.0.1:18976/mcp"
bearer_token = "${MCP_HUB_OPUS_TOKEN}"
forward_auth = false
read_only_targets = [
    "opus_health",
]
write_targets = [
    "opus_think",
    "opus_session",
]

[backends.timeout]
seconds = 900

[backends.concurrency]
max_concurrent = 4

# --- excalidraw: Excalidraw via a staging instance of the Python gateway.
[[backends]]
name = "excalidraw"
transport = "http"
url = "http://127.0.0.1:18975/mcp"
bearer_token = "${MCP_HUB_EXCALIDRAW_TOKEN}"
forward_auth = false
read_only_targets = [
    "read_me",
    "validate_view",
    "read_checkpoint",
    "library_list",
    "library_load",
]
write_targets = [
    "create_view",
    "export_to_excalidraw",
    "save_checkpoint",
    "library_mkdir",
    "library_save",
    "library_move",
]

[backends.timeout]
seconds = 60

[backends.concurrency]
max_concurrent = 4

# --- browser: Remote browser (Brave devtools) via a staging brave-devtools-gateway instance. Every tool is a
# write: reading pages can exfiltrate data and pages can carry prompt injection.
[[backends]]
name = "browser"
transport = "http"
url = "http://127.0.0.1:18974/mcp"
bearer_token = "${MCP_HUB_BROWSER_TOKEN}"
forward_auth = false
write_targets = [
    "click",
    "close_page",
    "drag",
    "emulate",
    "evaluate_script",
    "fill",
    "fill_form",
    "get_console_message",
    "get_network_request",
    "handle_dialog",
    "hover",
    "lighthouse_audit",
    "list_console_messages",
    "list_network_requests",
    "list_pages",
    "navigate_page",
    "new_page",
    "performance_analyze_insight",
    "performance_start_trace",
    "performance_stop_trace",
    "press_key",
    "resize_page",
    "select_page",
    "take_screenshot",
    "take_snapshot",
    "type_text",
    "wait_for",
]

[backends.timeout]
seconds = 120

[backends.concurrency]
max_concurrent = 4

[observability]
audit = true
json_logs = true

# --- finbank: Credit Mutuel read-only (AIS) via Enable Banking, stdio bridge.
# Added on the VPS by the finbank project; kept here so redeploys keep it.
[[backends]]
name = "finbank"
transport = "stdio"
command = "/usr/bin/python3"
args = ["/opt/finbank/deploy/hub-bridge.py"]
forward_auth = false
read_only_targets = ["accounts_list", "balances_get", "transactions_list", "summary_get", "status_get"]
write_targets = []
[backends.timeout]
seconds = 15
[backends.concurrency]
max_concurrent = 4
